name: CI

permissions:
  contents: read

on:
  pull_request:
    branches:
      - development
      - '[0-9]+.[0-9]+.x'
      - 'feature/**'
  workflow_dispatch:

  push:
    branches:
      - '[0-9]+.[0-9]+.x'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for coverage diff

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage diff-cover

      - name: Run tests with coverage
        run: |
          COVERAGE_FILE=unit_test.coverage pytest --cov=. --cov-report=html --cov-report=term -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage_unit_tests_report_${{ github.run_id }}.coverage
          path: unit_test.coverage
          retention-days: 30

  coverage:
    name: Full coverage
    runs-on: ubuntu-latest
    needs: [tests]
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coverage diff-cover

      - name: Download unit tests coverage report
        uses: actions/download-artifact@v7
        with:
          name: coverage_unit_tests_report_${{ github.run_id }}.coverage
          path: tests/coverage_reports/

      - name: list dir
        run: |
          ls tests/coverage_reports/

      - name: Combine coverage and generate XML
        run: |
          cd tests/coverage_reports
          coverage combine unit_test.coverage
          coverage xml -o combined.xml
          cd ../..

      - name: Create diff coverage report
        run: |
          diff-cover tests/coverage_reports/combined.xml \
            --compare-branch origin/development \
            --show-uncovered \
            --html-report tests/coverage_reports/combined_diff.html \
            --markdown-report tests/coverage_reports/diff_coverage.md

      - name: Add coverage to job summary
        if: github.event_name == 'pull_request'
        run: |
                   {
            echo "## 📊 Diff Coverage Report"
            echo ""
            cat tests/coverage_reports/diff_coverage.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload markdown coverage report for PR comment
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-markdown-report
          path: tests/coverage_reports/diff_coverage.md
          retention-days: 5

      - name: Upload coverage diff HTML report
        uses: actions/upload-artifact@v6
        with:
          name: coverage_combined_diff_report_${{ matrix.python-version }}_${{ github.run_id }}.html
          path: tests/coverage_reports/combined_diff.html
          retention-days: 30
