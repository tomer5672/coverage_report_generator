name: Post Coverage Comment

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  post_coverage_comment:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Download coverage artifact
        uses: dawidd6/action-download-artifact@2536c51d3d126276eb39f74d6bc9c72ac6ef30d3
        with:
          name: coverage-markdown-report
          workflow_conclusion: success
          run_id: ${{ github.event.workflow_run.id }}
          path: coverage_artifacts


      - name: Locate coverage file
        id: file
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "coverage_artifacts/diff_coverage.md" ]; then
            echo "Error: diff_coverage.md not found in coverage_artifacts/"
            ls -R coverage_artifacts || true
            exit 1
          fi

          cp coverage_artifacts/diff_coverage.md diff_coverage.md
          echo "Found coverage file at: coverage_artifacts/diff_coverage.md"

      - name: Debug head SHA
        run: |
          echo "head_sha: ${{ github.event.workflow_run.head_sha }}"

#      - name: Get PR number
#        id: pr
#        shell: bash
#        env:
#          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
#        run: |
#          set -euo pipefail
#
#          PR_NUMBER=$(curl -s \
#            -H "Accept: application/vnd.github+json" \
#            "https://api.github.com/repos/${{ github.repository }}/commits/${HEAD_SHA}/pulls" \
#            | jq -r '.[0].number // empty')
#
#          if [ -z "${PR_NUMBER}" ] || [ "${PR_NUMBER}" = "null" ]; then
#            echo "Error: No PR number found in workflow_run payload"
#            exit 1
#          fi
#
#          echo "Found PR number: ${PR_NUMBER}"
#          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Get PR number
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          # Define variables for readability
          REPO="${{ github.repository }}"
          HEAD_REPO="${{ github.event.workflow_run.head_repository.full_name }}"
          HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
          
          echo "Searching for PR from $HEAD_REPO:$HEAD_BRANCH in $REPO..."
          
          # Use the API to find the PR number
          PR_NUMBER=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls?head=${HEAD_REPO}:${HEAD_BRANCH}" \
            | jq -r '.[0].number // empty')
          
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "::error::Could not find a PR number. Ensure the 'CI' workflow was triggered by a pull_request event."
            exit 1
          fi
          
          echo "Found PR number: $PR_NUMBER"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build coverage comment file
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## 📊 Diff Coverage Report"
            echo ""
            echo "<details>"
            echo "<summary>📂 Click to view full coverage details</summary>"
            echo ""
            cat diff_coverage.md | head -n 1500
            echo ""
            echo "</details>"
          } > final_comment.md

      - name: Post Comment to PR
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b
        with:
          pr-number: ${{ steps.pr.outputs.pr_number }}
          file-path: final_comment.md
          comment-tag: coverage_report
          mode: recreate