name: Post Coverage Comment

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  comment:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Download coverage artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          name: coverage-markdown-report
          workflow_conclusion: success
          run_id: ${{ github.event.workflow_run.id }}
          path: coverage_artifacts


      - name: Locate coverage file and get PR number
        id: pr
        shell: bash
        env:
          PULL_REQUESTS_JSON: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail

          # Locate the markdown report (artifact layout can vary)
          REPORT_PATH=""
          if [ -f "coverage_artifacts/tests/coverage_reports/diff_coverage.md" ]; then
            REPORT_PATH="coverage_artifacts/tests/coverage_reports/diff_coverage.md"
          elif [ -f "coverage_artifacts/diff_coverage.md" ]; then
            REPORT_PATH="coverage_artifacts/diff_coverage.md"
          else
            REPORT_PATH=$(find coverage_artifacts -maxdepth 5 -type f -name 'diff_coverage.md' -print -quit || true)
          fi

          if [ -z "${REPORT_PATH}" ] || [ ! -f "${REPORT_PATH}" ]; then
            echo "Error: diff_coverage.md not found in downloaded artifact"
            ls -R coverage_artifacts || true
            exit 1
          fi

          cp "${REPORT_PATH}" diff_coverage.md

          # Extract PR number via jq from the full pull_requests JSON array
          echo "pull_requests JSON: ${PULL_REQUESTS_JSON}"
          PR_NUMBER=$(echo "${PULL_REQUESTS_JSON}" | jq -r '.[0].number // empty')

          if [ -z "${PR_NUMBER}" ] || [ "${PR_NUMBER}" = "null" ]; then
            echo "Error: No PR number found in workflow_run payload"
            echo "Full pull_requests payload: ${PULL_REQUESTS_JSON}"
            exit 1
          fi

          echo "Found PR number: ${PR_NUMBER}"
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Read coverage report
        id: read_report
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'REPORT_BODY<<EOF'
            cat diff_coverage.md
            echo 'EOF'
          } >> "$GITHUB_ENV"


      - name: Post Comment to PR
        uses: thollander/actions-comment-pull-request@v3
        with:
          pr-number: ${{ steps.pr.outputs.number }}
          message: |
            ## 📊 Diff Coverage Report
            <details>
            <summary>📂 Click to view full coverage details</summary>

            ${{ env.REPORT_BODY }}

            </details>
          comment-tag: coverage_report
          mode: recreate

